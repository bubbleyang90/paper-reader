<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark">
<title>纸页 Paper — 留一页安静</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script>
</head>
<body data-width="comfortable">
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C9.3 4.7 6.5 4.4 3 5.2v14c3.5-.8 6.3-.5 9 1.3 2.7-1.8 5.5-2.1 9-1.3v-14c-3.5-.8-6.3-.5-9 1.3Zm0 0v14"/><path d="M6.5 9.2c.8 0 1.6.2 2.4.5m-2.4 3c.8 0 1.6.2 2.4.5m6.2-3.5c.8-.3 1.6-.5 2.4-.5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 9V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1M3 9h16a2 2 0 0 1 2 2l-2 8H5a2 2 0 0 1-2-2Z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 13.1A9 9 0 0 1 10.9 3.3a9 9 0 1 0 9.8 9.8Z"/></symbol>
<symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
<symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h5m4 0h7M4 17h10m4 0h2"/><circle cx="11" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
<symbol id="i-outline" viewBox="0 0 24 24"><path d="M9 6h12M9 12h9M9 18h12M3 6h1m-1 6h1m-1 6h1"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19.5 3.5c-7.5-1-15 2-15 8a6 6 0 0 0 6 6c6 0 9-6.5 9-14ZM4 21 15 10"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>
<div class="app-shell">
<aside class="sidebar" aria-label="文档导航">
<div class="brand" aria-label="纸页 Paper"><span class="brand-mark"><svg class="icon"><use href="#i-book"/></svg></span><span class="brand-name">纸页<span>PAPER</span></span><span class="brand-dot" aria-hidden="true"></span></div>
<button id="open-file" class="open-button" type="button" title="打开 Markdown 文档（Ctrl + O）"><svg class="icon"><use href="#i-plus"/></svg><span>打开文档</span><kbd>Ctrl O</kbd></button>
<input id="file-input" type="file" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden aria-label="选择 Markdown 文档">
<nav class="library-nav" aria-label="我的书架">
<div class="section-label">我的书架<span class="section-rule"></span></div>
<button id="welcome-button" class="welcome-button active" type="button"><svg class="icon"><use href="#i-book"/></svg><span>阅读指南</span><span class="active-dot" aria-hidden="true"></span></button>
<div class="section-label recent-label"><span>最近阅读</span><button id="clear-recent" class="text-button" type="button" title="清空最近阅读记录">清空</button></div>
<div id="recent-list" class="recent-list"><p class="recent-empty">读过的文档，会留在这里</p></div>
</nav>
<div class="sidebar-bottom">
<div class="quiet-note" aria-hidden="true"><svg class="quiet-illustration" viewBox="0 0 132 76" fill="none"><path d="m33 48 31 9 35-12-32-9-34 12Z"/><path d="m33 48 1 11 30 9 35-12V45M64 57v11M38 55l20 6m12 0 23-8"/><path d="M66 36c-1-12 2-22 9-30M66 30C54 30 51 23 51 17c9-1 16 4 15 13Zm2-10c8 0 14-4 15-11-9-2-14 3-15 11Z"/><path class="illustration-faint" d="M23 65h8m70-5h8M37 26h5m-3-2v4m58-9h4m-2-2v4"/></svg><p>留一页安静，给自己。</p></div>
<button id="settings-toggle" class="settings-button" type="button" title="调整阅读设置" aria-expanded="false" aria-controls="settings-panel"><svg class="icon"><use href="#i-settings"/></svg><span>阅读设置</span><span class="settings-type" aria-hidden="true">Aa</span></button>
<div class="sidebar-caption"><span class="local-dot" aria-hidden="true"></span><span id="runtime-label">轻盈 · 本地 · 安静</span><span class="version-label">v0.1</span></div>
</div>
</aside>
<div class="main-shell">
<header class="toolbar">
<div class="breadcrumb"><button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" title="显示或隐藏书架" aria-label="显示或隐藏书架"><svg class="icon"><use href="#i-sidebar"/></svg></button><svg class="icon breadcrumb-icon"><use href="#i-file"/></svg><span class="breadcrumb-home">我的书架</span><span class="breadcrumb-separator">/</span><span id="breadcrumb-name">欢迎使用纸页.md</span></div>
<div class="toolbar-actions">
<button id="search-toggle" class="icon-button" type="button" title="搜索文档（Ctrl + F）" aria-label="搜索文档"><svg class="icon"><use href="#i-search"/></svg></button>
<button id="source-toggle" class="icon-button" type="button" title="查看 Markdown 源码" aria-label="查看 Markdown 源码" aria-pressed="false"><svg class="icon"><use href="#i-code"/></svg></button><span class="toolbar-divider" aria-hidden="true"></span>
<button id="theme-toggle" class="icon-button" type="button" title="切换阅读主题" aria-label="切换深色主题"><svg class="icon theme-moon"><use href="#i-moon"/></svg><svg class="icon theme-sun"><use href="#i-sun"/></svg></button>
<button id="focus-toggle" class="icon-button" type="button" title="专注模式（Ctrl + Shift + F）" aria-label="专注模式" aria-pressed="false"><svg class="icon"><use href="#i-focus"/></svg></button><span class="toolbar-divider" aria-hidden="true"></span>
<button id="outline-toggle" class="icon-button" type="button" title="显示或隐藏目录" aria-label="显示或隐藏目录" aria-pressed="true"><svg class="icon"><use href="#i-outline"/></svg></button>
</div>
</header>
<div id="search-bar" class="search-bar" role="search" hidden><svg class="icon"><use href="#i-search"/></svg><input id="search-input" type="search" placeholder="在这篇文档中查找…" aria-label="搜索当前文档" autocomplete="off" spellcheck="false"><span id="search-count" class="search-count" aria-live="polite">0 / 0</span><button id="search-prev" class="icon-button small" type="button" title="上一个结果（Shift + Enter）" aria-label="上一个结果"><svg class="icon"><use href="#i-up"/></svg></button><button id="search-next" class="icon-button small" type="button" title="下一个结果（Enter）" aria-label="下一个结果"><svg class="icon"><use href="#i-down"/></svg></button><button id="search-close" class="icon-button small" type="button" title="关闭搜索（Esc）" aria-label="关闭搜索"><svg class="icon"><use href="#i-close"/></svg></button></div>
<div class="reading-workspace">
<main id="reader-scroll" class="reader-scroll" aria-label="Markdown 阅读区"><div class="reading-page"><div class="article-kicker"><span class="document-badge"><svg class="icon"><use href="#i-leaf"/></svg>PAPER</span><span class="kicker-rule"></span><span>慢慢读，自有所得</span></div><article id="article" class="markdown-body"></article><pre id="source-view" class="source-view" tabindex="0" aria-label="Markdown 源码" hidden></pre><div class="document-end" aria-hidden="true"><span></span><svg class="icon"><use href="#i-leaf"/></svg><span></span></div></div></main>
<aside id="outline-panel" class="outline-panel" aria-label="文档目录"><div class="outline-heading"><svg class="icon"><use href="#i-outline"/></svg><span>本页目录</span></div><nav id="outline-list" class="outline-list" aria-label="章节导航"></nav><div class="outline-tip"><span class="tip-line"></span><span>一页文字，一段时光。</span></div></aside>
</div>
<footer class="statusbar"><div class="document-stats"><span class="status-dot" aria-hidden="true"></span><span id="status-words">0 字</span><span class="status-separator">·</span><svg class="icon"><use href="#i-clock"/></svg><span id="status-time">约 1 分钟</span></div><div class="reading-progress"><span class="progress-caption">阅读进度</span><span id="status-progress">0%</span><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></div></footer>
</div>
</div>
<section id="settings-panel" class="settings-panel" aria-label="阅读设置" hidden><div class="settings-heading"><span>让阅读更合心意</span><span>Aa</span></div><div class="setting-row"><span>正文字号</span><div class="font-controls"><button id="font-decrease" type="button" aria-label="减小字号" title="减小字号">A−</button><output id="font-size" aria-label="当前字号">17</output><button id="font-increase" type="button" aria-label="增大字号" title="增大字号">A+</button></div></div><div class="setting-row"><label for="width-select">页面宽度</label><select id="width-select"><option value="comfortable">舒适</option><option value="wide">宽阔</option></select></div><div class="theme-options" aria-label="阅读主题"><button id="theme-light" type="button" aria-pressed="true"><svg class="icon"><use href="#i-sun"/></svg><span>浅色</span></button><button id="theme-dark" type="button" aria-pressed="false"><svg class="icon"><use href="#i-moon"/></svg><span>深色</span></button><button id="theme-system" type="button" aria-pressed="false"><svg class="icon"><use href="#i-screen"/></svg><span>跟随系统</span></button></div><p class="settings-footnote">偏好会保存在这台设备上</p></section>
<div id="toast" class="toast" role="status" hidden></div>
<div id="drop-overlay" class="drop-overlay" hidden><div class="drop-card"><span class="drop-icon"><svg class="icon"><use href="#i-folder"/></svg></span><h2>把文字，放进来。</h2><p>松开以阅读 Markdown 文档</p><span>.md / .markdown / .mdown / .txt</span></div></div>
</body>
</html>
